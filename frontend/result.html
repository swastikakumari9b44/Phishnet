<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Security Analysis Result</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:'Inter',sans-serif;
}

.container{
max-width:1100px;
margin:auto;
padding:40px;
text-align:center;
}

h1{
font-family:'Orbitron',sans-serif;
font-size:36px;
letter-spacing:2px;
color:#22c55e;
text-shadow:0 0 10px #22c55e;
margin-bottom:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:12px;
}

.card h3{
margin-bottom:15px;
}

.meterWrap{
position:relative;
width:280px;
margin:auto;
}

.score{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:36px;
font-family:'Orbitron';
}

.high{color:#ef4444;}
.medium{color:#f59e0b;}
.low{color:#22c55e;}

.backBtn{
margin-top:40px;
padding:12px 25px;
background:#3b82f6;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>Security Analysis Report</h1>

<div class="dashboard">

<!-- Risk Meter -->
<div class="card">
<h3>Risk Meter</h3>

<div class="meterWrap">
<canvas id="riskChart"></canvas>
<div id="riskScore" class="score">0%</div>
</div>

<p id="riskText"></p>
</div>

<!-- Attack Indicators -->
<div class="card">
<h3>Attack Indicators</h3>
<canvas id="attackChart"></canvas>
</div>

<!-- Threat Radar -->
<div class="card">
<h3>Threat Radar</h3>
<canvas id="threatRadar"></canvas>
</div>

<!-- Explanation -->
<div class="card">
<h3>Explanation</h3>
<p id="explanation"></p>
</div>

<!-- Safety -->
<div class="card">
<h3>Safety Suggestions</h3>
<ul id="safety"></ul>
</div>

</div>

<button class="backBtn" onclick="goBack()">Analyze Another</button>

</div>


<script>

window.onload = function(){

let data = JSON.parse(localStorage.getItem("analysisResult")) || {};

/* ---------- DEFAULT FALLBACK ---------- */

if(!data || !data.score){
data={
risk_level:"High",
score:80,
prediction:"Phishing",
tactics:["Urgency","Fake Link","Impersonation"],
explanation:"This input shows phishing-like behavior."
};
}

/* ---------- FIX SCORE ---------- */

data.score = Math.min(100, data.score || 0);

/* ---------- RISK COLOR ---------- */

let riskColor = "#22c55e";

if(data.risk_level === "High") riskColor = "#ef4444";
else if(data.risk_level === "Medium") riskColor = "#f59e0b";

/* ---------- CHART ---------- */

let chart = new Chart(document.getElementById("riskChart"),{
type:'doughnut',
data:{
datasets:[{
data:[0,100],
backgroundColor:[riskColor,"#1e293b"]
}]
},
options:{
cutout:'75%',
plugins:{legend:{display:false}},
animation:false
}
});

/* ---------- ANIMATION FIX ---------- */

let score = 0;
let target = Math.min(100, data.score);

let interval = setInterval(()=>{

score++;

if(score > target){
clearInterval(interval);
return;
}

document.getElementById("riskScore").innerText = score + "%";

chart.data.datasets[0].data = [score,100-score];
chart.update();

},20);

/* ---------- RISK TEXT ---------- */

document.getElementById("riskText").innerHTML =
`Risk Level: <span class="${(data.risk_level || "low").toLowerCase()}">${data.risk_level}</span>`;


/* ---------- ATTACK INDICATORS ---------- */

let indicators = data.tactics || data.issues || [];

if(!indicators || indicators.length === 0){
indicators = ["Suspicious Language","Unknown Source","Possible Scam"];
}

let values = indicators.map(()=>Math.floor(Math.random()*5)+3);

new Chart(document.getElementById("attackChart"),{
type:'bar',
data:{
labels:indicators,
datasets:[{
data:values,
backgroundColor:riskColor
}]
},
options:{
indexAxis:'y',
scales:{x:{display:false},y:{ticks:{color:"white"}}},
plugins:{legend:{display:false}}
}
});


/* ---------- RADAR ---------- */

let radarLabels=[
"Phishing",
"Impersonation",
"Credential Theft",
"Malicious Links",
"Social Engineering"
];

let radarValues = radarLabels.map(()=>Math.min(10, Math.random()*10));

new Chart(document.getElementById("threatRadar"),{
type:'radar',
data:{
labels:radarLabels,
datasets:[{
data:radarValues,
backgroundColor:"rgba(239,68,68,0.2)",
borderColor:"#ef4444"
}]
},
options:{
plugins:{legend:{display:false}}
}
});


/* ---------- EXPLANATION ---------- */

document.getElementById("explanation").innerText =
data.explanation || "This input shows phishing-like behavior.";


/* ---------- SAFETY ---------- */

document.getElementById("safety").innerHTML = `
<li>Do not click suspicious links</li>
<li>Verify sender identity</li>
<li>Never share OTP or passwords</li>
<li>Use official websites only</li>
`;

};


/* ---------- BACK ---------- */

function goBack(){
window.location.href="index.html";
}

</script>

</body>
</html>
