<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishNet AI Security</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<!-- YOUR SCRIPT -->
<script src="script.js" defer></script>

<style>

:root{
--bg:#05070d;
--card:#0f172a;
--accent:#00e5ff;
--text:#e2e8f0;
--muted:#64748b;
}

/* BODY */

body{
margin:0;
background: radial-gradient(circle at 20% 10%, #0f172a, #020617);
color:var(--text);
font-family:'Outfit',sans-serif;
}

/* CONTAINER */

.container{
max-width:850px;
margin:auto;
padding:60px 20px;
}

/* TITLE */

.title{
font-size:42px;
font-weight:800;
background: linear-gradient(90deg,#00e5ff,#7c3aed);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

.subtitle{
color:var(--muted);
margin-top:10px;
}

/* CARD */

.card{
margin-top:40px;
background:rgba(15,23,42,0.6);
border:1px solid rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-radius:16px;
padding:30px;
}

/* TABS */

.tab-row{
display:flex;
gap:8px;
background:#020617;
padding:5px;
border-radius:12px;
margin-bottom:25px;
}

.tab-btn{
flex:1;
padding:12px;
border:none;
background:transparent;
color:var(--muted);
cursor:pointer;
border-radius:10px;
font-weight:600;
transition:.2s;
}

.tab-btn.active{
background:#111827;
color:white;
box-shadow:0 0 10px rgba(0,229,255,0.2);
}

/* INPUT */

textarea,input{
width:100%;
padding:15px;
background:#020617;
border:1px solid rgba(255,255,255,0.08);
border-radius:10px;
color:white;
margin-top:10px;
}

textarea:focus,input:focus{
border-color:var(--accent);
outline:none;
}

/* BUTTON */

button{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00e5ff,#6366f1);
color:white;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,229,255,0.2);
}

/* UPLOAD BOX */

.upload-box{
border:2px dashed rgba(255,255,255,0.2);
padding:30px;
text-align:center;
border-radius:12px;
cursor:pointer;
transition:.3s;
margin-top:10px;
}

.upload-box:hover{
border-color:var(--accent);
background:rgba(0,229,255,0.05);
}

/* OCR PREVIEW */

#ocrPreview{
margin-top:10px;
font-size:12px;
color:var(--muted);
}

</style>
</head>

<body>

<div class="container">

<h1 class="title">PhishNet AI</h1>
<p class="subtitle">Detect phishing, scams & malicious links instantly</p>

<div class="card">

<!-- TABS -->

<div class="tab-row">
<button class="tab-btn active" id="msgTab" onclick="showTab('text')">Message</button>
<button class="tab-btn" id="urlTabBtn" onclick="showTab('url')">URL</button>
<button class="tab-btn" id="imgTab" onclick="showTab('image')">📸 Screenshot</button>
</div>

<!-- MESSAGE -->

<div id="textSection">
<textarea id="messageInput" placeholder="Paste suspicious message..."></textarea>
<button onclick="analyzeText()">Analyze Message</button>
</div>

<!-- URL -->

<div id="urlSection" style="display:none">
<input type="text" id="urlInput" placeholder="Paste suspicious URL...">
<button onclick="analyzeURL()">Analyze URL</button>
</div>

<!-- IMAGE -->

<div id="imageSection" style="display:none">

<label class="upload-box">
📸 Drag & drop screenshot or click
<input type="file" id="imageInput" accept="image/*" hidden>
</label>

<button onclick="analyzeImage()">Analyze Screenshot</button>

<p id="ocrPreview"></p>

</div>

</div>

</div>

</body>
</html>
